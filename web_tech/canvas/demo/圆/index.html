  window.onresize = function(){

 }

function draow(){
    
    var scale = window.devicePixelRatio;
    let canvas_demo_1 = document.getElementById("canvas-demo-1");
  
    var context = canvas_demo_1.getContext('2d');

    canvas_demo_1.width = 400 * scale;
    canvas_demo_1.height = 400 * scale;
    canvas_demo_1.style.width = canvas_demo_1.width + 'px';
    canvas_demo_1.style.height = canvas_demo_1.height + 'px';

    console.log(`dpr:${scale}`)
    console.log(`宽:${canvas_demo_1.width}，高度 y:${canvas_demo_1.height}`)

    context.beginPath();
    //context.moveTo(300/2, 300/2);
    context.arc(canvas_demo_1.width/2, canvas_demo_1.width/2, canvas_demo_1.width/2, 0, 8, false);
    context.closePath();
    context.fillStyle = '#e6e5e5';
    context.fill();
  }
